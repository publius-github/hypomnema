name: ci

on:
  push:
    branches: [main, development]
  pull_request:
  # release.yml runs these same gates before it builds an installer
  workflow_call:

# Read-only by default: nothing here publishes or writes to the repo.
permissions:
  contents: read

# Third-party actions are pinned to a commit (the tag is in the comment);
# Dependabot keeps both up to date. The Rust toolchain is pinned the same
# way - dtolnay/rust-toolchain's `1.98.0` branch - so a new stable clippy
# lint lands as a deliberate bump, not as a red CI on an unrelated PR.
# Cargo runs --locked: a Cargo.toml change without its Cargo.lock fails
# here instead of the runner quietly resolving new versions (release.yml
# runs these gates on the tagged commit, so the release build is covered).

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # the unit tests, with a coverage report attached to the run
      - run: npm run coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-frontend
          path: coverage/
          retention-days: 14
      - run: npm run build

  # The real frontend bundle in Chromium against the in-memory fake core
  # (e2e/app/backend.ts): navigation, task flows, dialogs.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 14

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri
      # tauri-build requires the frontendDist path to exist at compile time
      - run: mkdir -p dist
      - name: rustfmt
        run: cargo fmt --check
        working-directory: src-tauri
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - name: tests
        run: cargo test --locked
        working-directory: src-tauri

  # Line coverage of the Rust core, as a report on the run - informative,
  # not a gate.
  rust-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri
      - run: mkdir -p dist
      - name: coverage
        working-directory: src-tauri
        run: |
          cargo llvm-cov --locked --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-rust
          path: src-tauri/lcov.info
          retention-days: 14

  # The shipped platform: the tray, the capture window and the other
  # cfg(windows) code only compile here, so a break in them shows up on
  # the pull request instead of on the release tag.
  rust-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri
      - run: mkdir dist
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - name: tests
        run: cargo test --locked
        working-directory: src-tauri

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks lists a pull request's commits through the API
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # gitleaks scans the history of the pushed range
          fetch-depth: 0
      # Known vulnerabilities and license compatibility of every crate;
      # the policy is src-tauri/deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
      # Only what ships inside the app; dev tooling advisories are
      # Dependabot's to raise.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=moderate
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
