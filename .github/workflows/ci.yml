name: ci

on:
  push:
    branches: [main, development]
  pull_request:
  # release.yml runs these same gates before it builds an installer
  workflow_call:
  # Weekly, so a new advisory against an unchanged lockfile (or a runner
  # image that stopped building the app) shows up without a push
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Read-only by default: nothing here publishes or writes to the repo.
permissions:
  contents: read

# A new push to a pull request cancels its older run. Branch pushes, the
# weekly run and the release call (a different event name) never cancel.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to a commit (the tag is in the comment);
# Dependabot keeps both up to date. Node comes from .nvmrc (inside
# package.json's engines). The Rust toolchain is pinned the same
# way - dtolnay/rust-toolchain's `1.98.0` branch - so a new stable clippy
# lint lands as a deliberate bump, not as a red CI on an unrelated PR.
# Cargo runs --locked: a Cargo.toml change without its Cargo.lock fails
# here instead of the runner quietly resolving new versions (release.yml
# runs these gates on the tagged commit, so the release build is covered).

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # the unit tests, with a coverage report attached to the run
      - run: npm run coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: coverage/
          retention-days: 14
      - run: npm run build

  # The real frontend bundle in Chromium against the in-memory fake core
  # (e2e/app/backend.ts): navigation, task flows, dialogs.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 14

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # tauri-build requires the frontendDist path to exist at compile time
      - run: mkdir -p dist
      - name: rustfmt
        run: cargo fmt --check
        working-directory: src-tauri
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - name: tests
        run: cargo test --locked
        working-directory: src-tauri
      # cargo test regenerates the ts-rs bindings; the frontend compiles
      # against the committed ones, so they must be what the core exports
      - name: TypeScript bindings are up to date
        run: |
          git diff --exit-code -- src/bindings
          untracked="$(git ls-files --others --exclude-standard -- src/bindings)"
          if [ -n "$untracked" ]; then
            echo "Generated bindings not committed: $untracked"
            exit 1
          fi
      # THIRD_PARTY_LICENSES.txt ships inside the app; a dependency change
      # (a Dependabot PR included) has to regenerate it
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: THIRD_PARTY_LICENSES.txt is up to date
        run: |
          node scripts/general/third-party-licenses.mjs
          git diff --exit-code -- THIRD_PARTY_LICENSES.txt || {
            echo "Run node scripts/general/third-party-licenses.mjs and commit the result"
            exit 1
          }

  # Line coverage of the Rust core, as a report on the run - informative,
  # not a gate.
  rust-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: mkdir -p dist
      - name: coverage
        working-directory: src-tauri
        run: |
          cargo llvm-cov --locked --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: src-tauri/lcov.info
          retention-days: 14

  # The shipped platform: the tray, the capture window and the other
  # cfg(windows) code only compile here, so a break in them shows up on
  # the pull request instead of on the release tag.
  rust-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: mkdir dist
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - name: tests
        run: cargo test --locked
        working-directory: src-tauri

  # Developer Certificate of Origin: every commit a pull request adds
  # carries a Signed-off-by line (CONTRIBUTING.md). Dependabot's commits
  # are exempt - it cannot sign off.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            case "$author" in *'dependabot[bot]'*) continue ;; esac
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qF "$author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") has no 'Signed-off-by: $author' (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks lists a pull request's commits through the API
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the history of the pushed range
          fetch-depth: 0
      # Known vulnerabilities and license compatibility of every crate;
      # the policy is src-tauri/deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
      # Only what ships inside the app; dev tooling advisories are
      # Dependabot's to raise.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=moderate
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without it the action downloads whatever gitleaks is newest;
          # Dependabot does not see this one - bump it with the action
          GITLEAKS_VERSION: 8.30.1
