name: release

on:
  push:
    tags:
      - "v*"

# Only the build and attach jobs write (the draft release); the reusable CI it
# calls gets read access.
permissions:
  contents: read

jobs:
  # A minute, before the half hour of gates: the tag must name the VERSION
  # file's version and CHANGELOG.md must describe it. The entry becomes
  # the release notes.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The VERSION file is the source of truth; the tag must match it
      - name: Check tag matches VERSION file
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION file (v$version)"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          node scripts/general/changelog-entry.mjs > notes.md
          {
            echo "notes<<HYPOMNEMA_NOTES_EOF"
            cat notes.md
            echo "HYPOMNEMA_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # The full CI gates on the tagged commit: an installer is only built,
  # signed and offered to every user's updater from code that passes them.
  checks:
    needs: verify
    uses: ./.github/workflows/ci.yml
    # A called workflow can only narrow the caller's token, never widen
    # it: these are exactly the permissions ci.yml's jobs ask for (audit
    # lists pull request commits), or the run fails before it starts.
    permissions:
      contents: read
      pull-requests: read

  build-windows:
    needs: [verify, checks]
    # The signing key and the client secret belong in this environment's
    # secrets, behind a required reviewer, so a pushed tag alone cannot
    # sign anything (set up under Settings > Environments).
    environment: release
    permissions:
      contents: write
      # the provenance attestation below: an OIDC token to sign with,
      # and the right to store the attestation under this repository
      id-token: write
      attestations: write
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # Third-party code runs here - install scripts, then tsc, vite and
      # the postcss plugins - so it runs before any secret is in reach:
      # checkout keeps no token, and these steps get no env. The tauri
      # step below then skips beforeBuildCommand (tauri.release.conf.json)
      # and bundles this dist/ as it is.
      - run: npm ci
      - run: npm run build
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled into google_auth.rs; without the secret the installer
          # builds fine but cannot sign in to Google. The id is optional
          # (the source carries the project's own as the default).
          HYPOMNEMA_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.HYPOMNEMA_GOOGLE_DESKTOP_CLIENT_SECRET }}
          HYPOMNEMA_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.HYPOMNEMA_GOOGLE_DESKTOP_CLIENT_ID }}
        with:
          # __VERSION__ resolves to the app version, synced from VERSION
          tagName: v__VERSION__
          releaseName: Hypomnema v__VERSION__
          releaseBody: ${{ needs.verify.outputs.notes }}
          releaseDraft: true
          args: --config src-tauri/tauri.release.conf.json
      # SLSA build provenance for the installer, signed by GitHub's
      # Sigstore instance: `gh attestation verify <exe> --repo <this repo>`
      # proves a download came out of this workflow on this commit. The
      # public Sigstore log only takes public repositories, so a rehearsal
      # tag on the private repository skips it instead of failing here.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*.exe

  # The Android APK, from the same gates and behind the same approval (one
  # review of the `release` environment lets both builds through). Built
  # by scripts/android/build.sh with no secret in reach - Gradle, the
  # Tauri CLI and every npm and Cargo build script run in that step, and
  # the release variant comes out signed with the runner's throwaway debug
  # key - then re-signed with the project's key by apksigner, from the
  # SDK, in a step of its own.
  build-android:
    needs: [verify, checks]
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The project's signing certificate, published in the README: the
      # signing step refuses a keystore whose certificate is not this one.
      ANDROID_CERT_SHA256: "966414d27eb951be10ecfc117d0930b4c43f2ae8535b33893825abcf29c2b191"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # The runner image carries an Android SDK; pin the pieces
      # docs/android/ARCHITECTURE.md names rather than take its latest NDK,
      # and the JDK 17 the Gradle plugin needs (the image has several).
      - name: Android SDK, NDK and JDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;35.0.0" "platform-tools" "ndk;27.0.12077973"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973"
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973"
            echo "JAVA_HOME=$JAVA_HOME_17_X64"
          } >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build the APK
        env:
          ANDROID_ABIS: aarch64
        run: scripts/android/build.sh release
      - name: Sign the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          built=(releases/android/*-release-*.apk)
          if [ "${#built[@]}" -ne 1 ]; then
            echo "expected one release APK, found: ${built[*]}"
            exit 1
          fi
          mkdir -p dist-android
          apk="dist-android/Hypomnema_${version}_arm64.apk"
          keystore="$RUNNER_TEMP/hypomnema-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" sign --ks "$keystore" --ks-pass env:ANDROID_KEYSTORE_PASS \
            --ks-key-alias hypomnema --out "$apk" "${built[0]}"
          rm -f "$keystore"
          certs="$("$apksigner" verify --print-certs "$apk")"
          echo "$certs"
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$certs")"
          if [ "$signer" != "$ANDROID_CERT_SHA256" ]; then
            echo "signed with $signer, expected the project's certificate $ANDROID_CERT_SHA256"
            exit 1
          fi
      # Same provenance as the installer: `gh attestation verify <apk>
      # --repo <this repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist-android/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: dist-android/*.apk
          if-no-files-found: error

  # The draft release is tauri-action's, made in build-windows: the APK
  # joins it once both are done.
  attach-android:
    needs: [build-windows, build-android]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: dist-android
      - name: Attach the APK to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" dist-android/*.apk
