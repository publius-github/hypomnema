name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
      # The VERSION file is the source of truth; the tag must match it
      - name: Check tag matches VERSION file
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION file (v$version)"
            exit 1
          fi
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # __VERSION__ resolves to the app version, synced from VERSION
          tagName: v__VERSION__
          releaseName: Hypomnema v__VERSION__
          releaseDraft: true
