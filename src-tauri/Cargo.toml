[package]
name = "hypomnema"
version = "0.69.0"
description = "Weekly planner, journal, and personal knowledge base"
edition = "2021"

[lib]
name = "hypomnema_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
croner = "2"
notify = "6"
ts-rs = "10"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
# Pure Rust, so the Android cross-compile stays free of native deps -
# same constraint that picked ureq/rustls over a native-TLS client.
aes-gcm = "0.10"
argon2 = "0.5"
tauri-plugin-opener = "2.5.5"

# JNI is how the app asks Android for all-files access itself, rather
# than telling the user to go find a settings screen. Android-only, and
# already in the tree via tauri - named here so this crate can call it.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
