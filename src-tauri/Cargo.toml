[package]
name = "hypomnema"
version = "0.110.8"
description = "Weekly planner, journal, and personal knowledge base"
license = "GPL-3.0-only"
repository = "https://github.com/publius-github/app-hypomnema"
edition = "2021"

[lib]
name = "hypomnema_lib"
# cdylib is the Android app's library, rlib links into the desktop binary.
# No staticlib: only an iOS build needs it, and in a debug build it is a
# 1 GB archive written on every compile.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml itself is archived; serde_norway is its maintained
# continuation of the same 0.9 line (same API, same output), imported
# under the old name so call sites read as plain serde_yaml.
serde_yaml = { package = "serde_norway", version = "0.9" }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
croner = "2"
notify = "8"
ts-rs = { version = "10", features = ["no-serde-warnings"] }
ureq = "3"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
# Pure Rust, so the Android cross-compile stays free of native deps -
# same constraint that picked ureq/rustls over a native-TLS client.
aes-gcm = "0.10"
argon2 = "0.5"
tauri-plugin-opener = "2.5.5"
diffy = "0.4"
# The Google refresh token goes into the OS credential store on Windows;
# keyring-core is the store-agnostic API (and its mock store the test
# double), the Windows store below is the only backend this app ships.
keyring-core = "1"

# A second launch (a shortcut clicked while the app sits in the tray)
# must hand over to the running instance: two copies fight over the
# global capture shortcut and both write the same vault. Desktop-only
# plugin; a phone app is single-instance by the OS already.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# JNI is how the app asks Android for all-files access itself, rather
# than telling the user to go find a settings screen. Android-only, and
# already in the tree via tauri - named here so this crate can call it.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# Google sign-in through Play services (AuthorizationClient). Kotlin
# lives in the plugin's own android/ source set, tracked here rather
# than in the regenerated gen/android project.
tauri-plugin-google-auth = { path = "plugins/google-auth" }

# Windows Credential Manager behind keyring-core. Without the default
# `search` feature it is only CredRead/CredWrite/CredDelete through
# windows-sys, no regex.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

# Line tables keep file:line in backtraces and test failures; full debug
# info made every test binary hundreds of MB, copied anew on each version
# bump. Dependencies are not debugged here, so they carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
