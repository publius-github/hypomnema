# cargo-deny: run in CI (ci.yml, "audit") over the Rust dependency tree.
# Locally: `cargo deny check` from src-tauri/.

[graph]
# Every platform the app ships on, so Windows- and Android-only crates
# are checked too.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-linux-android",
]
all-features = true

[licenses]
# Everything here is compatible with shipping inside a GPL-3.0-only
# binary. A new license in the tree fails CI until it is checked and
# added - THIRD_PARTY_LICENSES.txt has to carry its text anyway.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
]
confidence-threshold = 0.9

[licenses.private]
# The app crate and its in-tree plugin are not published.
ignore = true

[advisories]
# Unmaintained crates deep in the Tauri/GTK tree are not ours to swap;
# report them, but fail only on actual vulnerabilities.
unmaintained = "none"
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
