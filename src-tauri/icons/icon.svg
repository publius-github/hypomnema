<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- "Dog-ear": a paper-white tile with a black H cut out of two
       interlocking brackets on a 5x5 grid of 112px cells, every line one
       cell thick; the empty bottom-right corner holds a folded page corner.
       Source for every platform icon: tauri icon icons/icon-manifest.json
       (Android layers in android-*.svg). -->
  <rect x="48" y="48" width="928" height="928" rx="208" fill="#FFFFFF"/>
  <!-- a faint rim keeps the tile from dissolving into a light taskbar -->
  <rect x="54" y="54" width="916" height="916" rx="202" fill="none" stroke="#000000" stroke-opacity="0.14" stroke-width="12"/>
  <g fill="#111111">
    <path d="M344 232H792V680H680V344H568V456H456V344H344Z"/>
    <path d="M232 344H344V680H456V568H568V680H680V792H232Z"/>
    <path d="M710 710H762L710 762Z"/>
  </g>
</svg>
