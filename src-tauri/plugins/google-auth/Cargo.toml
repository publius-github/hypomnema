[package]
name = "tauri-plugin-google-auth"
version = "0.1.0"
description = "Hypomnema's Google sign-in on Android: Google Identity Services AuthorizationClient behind a Tauri mobile plugin"
edition = "2021"
publish = false
# Tauri's build scripts find the plugin's Android library through this.
links = "tauri-plugin-google-auth"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
